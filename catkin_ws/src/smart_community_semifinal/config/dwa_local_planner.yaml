DWAPlannerROS:
  holonomic_robot: true
  max_vel_x: 0.18
  min_vel_x: 0.0
  max_vel_y: 0.12
  min_vel_y: -0.12
  max_vel_trans: 0.20
  min_vel_trans: 0.01
  max_rot_vel: 0.55
  min_rot_vel: 0.05
  acc_lim_x: 0.35
  acc_lim_y: 0.35
  acc_lim_theta: 1.0
  xy_goal_tolerance: 0.025
  # The guard independently checks footprint/lane geometry.  A tight yaw
  # target makes DWA spin at a narrow-corridor waypoint when map yaw has a few
  # degrees of normal AMCL error; position and safety constraints remain tight.
  yaw_goal_tolerance: 0.35
  latch_xy_goal_tolerance: true
  sim_time: 0.80
  sim_granularity: 0.02
  angular_sim_granularity: 0.03
  vx_samples: 5
  vy_samples: 7
  vth_samples: 12
  path_distance_bias: 32.0
  goal_distance_bias: 20.0
  occdist_scale: 0.05
  stop_time_buffer: 0.20
  oscillation_reset_dist: 0.05
  forward_point_distance: 0.10
