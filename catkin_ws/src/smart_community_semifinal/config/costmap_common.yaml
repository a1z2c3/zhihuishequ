# Shared geometry and laser observation contract for the optional standard
# navigation stack.  Lane paint is visual-only and therefore not in this map.
footprint: [[0.187, 0.1715], [0.187, -0.1715], [-0.187, -0.1715], [-0.187, 0.1715]]
footprint_padding: 0.005
transform_tolerance: 0.30
obstacle_range: 1.8
raytrace_range: 2.5
observation_sources: laser_scan_sensor
laser_scan_sensor:
  sensor_frame: laser_link
  data_type: LaserScan
  topic: /scan
  marking: true
  clearing: true
  inf_is_valid: true
  expected_update_rate: 0.20
  observation_persistence: 0.0
inflation_radius: 0.04
cost_scaling_factor: 5.0
