base_global_planner: navfn/NavfnROS
base_local_planner: dwa_local_planner/DWAPlannerROS
# The guard command watchdog uses wall time. At the verified 0.2x Gazebo
# speed, 5 Hz in simulation can arrive one wall-second apart; 10 Hz keeps
# requested commands fresh without weakening the safety timeout.
controller_frequency: 10.0
controller_patience: 20.0
planner_frequency: 1.0
planner_patience: 10.0
oscillation_timeout: 20.0
oscillation_distance: 0.05
recovery_behavior_enabled: false
clearing_rotation_allowed: false
shutdown_costmaps: false
